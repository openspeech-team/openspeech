[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openspeech-core"
version = "0.4.0"
description = "Open-Source Toolkit for End-to-End Automatic Speech Recognition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Soohwan Kim", email = "sh951011@gmail.com" },
    { name = "Sangchun Ha", email = "seomk9896@gmail.com" },
    { name = "Soyoung Cho", email = "soyoung.cho@kaist.ac.kr" },
]
keywords = ["openspeech", "asr", "speech_recognition", "lightning", "hydra"]
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "numpy>=1.23",
    "pandas",
    "librosa>=0.10",
    "levenshtein",
    "sentencepiece",
    "lightning>=2.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "joblib",
    "tqdm",
    "wget",
]

[project.optional-dependencies]
wandb = ["wandb"]
dev = ["pytest", "black==22.3.0", "pre-commit", "ruff"]

[project.urls]
Homepage = "https://github.com/openspeech-team/openspeech"

[tool.setuptools.packages.find]
include = ["openspeech*", "openspeech_cli*"]

[tool.black]
line-length = 120
